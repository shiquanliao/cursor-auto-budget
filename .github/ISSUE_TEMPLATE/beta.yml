name: 申请首批体验
description: 提交系统环境与大致使用频率，申请小范围内测
title: "[Beta] "
labels: ["beta-request"]
body:
  - type: markdown
    attributes:
      value: |
        感谢申请。请勿在公开 Issue 中提交账号、密码、Cookie、API Token、付款信息或其他敏感数据。
  - type: dropdown
    id: system
    attributes:
      label: 操作系统
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: 芯片架构
      options:
        - Apple Silicon
        - Intel / AMD x86_64
        - 不确定
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: 预计每天使用频率
      options:
        - 1–3 次
        - 4–10 次
        - 10 次以上
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: 最希望解决的开发任务
      description: 请描述任务类型，不要粘贴私有代码或凭据。
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: 确认
      options:
        - label: 我没有在本 Issue 中提交任何敏感凭据
          required: true
